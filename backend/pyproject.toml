# Tool settings for the backend. Run from the backend folder (or inside the backend container):
#   ruff check . && ruff format --check app   # style and mistakes
#   mypy                                      # types
#   pytest --cov                              # tests and coverage (see the gate in .github/workflows/ci.yml)

[tool.ruff]
line-length = 200  # long explanatory lines are allowed; the limit is a guard against extremes, not a style rule
target-version = "py312"
extend-exclude = ["migrations/versions"]  # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI puts Depends(...) in argument defaults by design
    "B905",  # zip(strict=...) adds nothing where the lengths are equal by construction
    "UP017",  # keep timezone.utc: it reads the same everywhere in the code base
    "UP047",  # plain TypeVar generics are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401", "E501", "E702", "E741", "B007"]  # fixtures are imported from other test modules; test tables are dense
"app/answers/prompt.py" = ["E501"]  # the prompt text is one long line per rule; changing it changes the prompt version
"app/eval/runner.py" = ["E501"]  # dense scenario tables
"app/scripts/gen_api_docs.py" = ["E501"]  # the page text is written as long lines

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
