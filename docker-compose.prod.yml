# Production settings on top of docker-compose.yml (Phase 9D). Use both files together:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# What changes: everything restarts by itself, the API runs without auto-reload and with APP_ENV=production (secure cookies and the
# guards that stop demo scripts), the website runs as a container, and the test mailbox is not started. See docs/deployment.md.
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  storage:
    restart: unless-stopped
  mailpit:
    profiles: ["dev"]  # a fake inbox is for development only; production needs a real mail server (SMTP_HOST in .env)
  backend:
    restart: unless-stopped
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_WORKERS:-1}"]
    environment:
      APP_ENV: production
  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:8000}"
    image: securesearch-frontend:prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
